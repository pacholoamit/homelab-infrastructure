name: zenos-runner-image

# Builds images/zenos-runner, the TrueNAS runners' image, and pushes
# ghcr.io/pacholoamit/zenos-runner for the zenos-runner StatefulSet in
# clusters/home/apps/zenos-runners. Tags: the Dockerfile's RUNNER_VERSION
# (moves with every rebuild of that version) and sha-<commit>. The StatefulSet
# pins the digest, so a push here changes nothing in the cluster until
# statefulset.yaml takes the new digest from this run's summary.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - images/zenos-runner/**
      - .github/workflows/zenos-runner-image.yml

permissions:
  contents: read

concurrency:
  group: zenos-runner-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/pacholoamit/zenos-runner
    steps:
      # Credentials stay at the default (persisted): with persist-credentials
      # false, checkout strips them at once through `git submodule foreach`,
      # which fails on the k3s-ansible gitlink that has no .gitmodules entry.
      - uses: actions/checkout@v7

      - name: Runner version
        id: runner
        run: |
          VERSION=$(sed -n 's|^ARG RUNNER_VERSION=\([0-9.]*\)$|\1|p' images/zenos-runner/Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::No 'ARG RUNNER_VERSION=<version>' line in images/zenos-runner/Dockerfile."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.runner.outputs.version }}
            type=sha
          labels: |
            org.opencontainers.image.title=zenos-runner
            org.opencontainers.image.description=GitHub Actions runner for ZenOS CI (the TrueNAS runner image, for the homelab cluster)

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images/zenos-runner
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          VERSION: ${{ steps.runner.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### zenos-runner'
            echo 'Pin in clusters/home/apps/zenos-runners/statefulset.yaml:'
            echo '```'
            echo "${IMAGE}:${VERSION}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
