# Longhorn with a single replica, kept on the runner's node, for the ZenOS
# runners' work, bun and npm volumes. Everything on them rebuilds itself (a
# checkout and two package caches), so more replicas would only cost disk and
# write speed. At 3 replicas the two runners' 25Gi each would claim ~50Gi of
# Longhorn's schedulable space on every node, and each node has ~40Gi left.
# The runner identity (state) stays on the replicated `longhorn` class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-runner-cache
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  dataLocality: best-effort
  staleReplicaTimeout: "30"
  fsType: ext4
  dataEngine: v1
