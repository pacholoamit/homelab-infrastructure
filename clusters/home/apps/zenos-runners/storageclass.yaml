# Longhorn with a single replica, kept on the runner's node, for the ZenOS
# runners' work and npm volumes. Everything on them rebuilds itself (a
# checkout, bun's and npm's package caches), so replicas would only cost write
# speed and disk: on a 40k-file benchmark one replica took 49.5 s, like
# local-path, and three took 88.8 s. Three replicas of the two runners' 17Gi
# would also claim ~34Gi of the ~40Gi Longhorn can still schedule per node.
# The runner identity (state) stays on the replicated `longhorn` class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-runner-cache
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  dataLocality: best-effort
  staleReplicaTimeout: "30"
  fsType: ext4
  dataEngine: v1
