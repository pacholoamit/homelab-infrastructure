apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  annotations:
    glance/hide: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
        - name: chrome
          # Zenika's image from Docker Hub: gcr.io/zenika-hub answers 403 to
          # pulls, which left this pod in ImagePullBackOff from 2026-11-13.
          image: zenika/alpine-chrome:124
          command:
            - chromium-browser
            - --headless
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --hide-scrollbars
