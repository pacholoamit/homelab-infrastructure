apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  annotations:
    glance/hide: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          # Pinned to match the on-disk data.ms format (v1.11.3).
          # v1.52.0 refused to start: the engine now wants MEILI_UPGRADE_DB,
          # which replaced MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE, so the old flag
          # silently stopped guarding the upgrade. Migrating is one-way, so it
          # needs a deliberate run with a fresh backup rather than an image bump.
          image: getmeili/meilisearch:v1.11.3
          env:
            - name: MEILI_NO_ANALYTICS
              value: "true"
          volumeMounts:
            - mountPath: /meili_data
              name: meilisearch
          envFrom:
            - secretRef:
                name: hoarder-secrets
            - configMapRef:
                name: hoarder-configuration
      volumes:
        - name: meilisearch
          persistentVolumeClaim:
            claimName: meilisearch-pvc