apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  annotations:
    glance/hide: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.52.0
          env:
            - name: MEILI_NO_ANALYTICS
              value: "true"
            # Required to open the v1.11-era data.ms with a newer engine
            # without a manual dump/restore (supported since v1.12)
            - name: MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE
              value: "true"
          volumeMounts:
            - mountPath: /meili_data
              name: meilisearch
          envFrom:
            - secretRef:
                name: hoarder-secrets
            - configMapRef:
                name: hoarder-configuration
      volumes:
        - name: meilisearch
          persistentVolumeClaim:
            claimName: meilisearch-pvc