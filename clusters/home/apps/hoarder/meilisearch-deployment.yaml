apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  annotations:
    glance/hide: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          # Migrated from v1.11.3 via dump/restore on 2026-08-10. The dumpless
          # upgrade path (MEILI_UPGRADE_DB) only supports source DBs from v1.12
          # on, so it could never have worked from 1.11.3 whatever the flag was
          # called. Future major jumps need the same dump/restore treatment.
          image: getmeili/meilisearch:v1.52.3
          env:
            - name: MEILI_NO_ANALYTICS
              value: "true"
          volumeMounts:
            - mountPath: /meili_data
              name: meilisearch
          envFrom:
            - secretRef:
                name: hoarder-secrets
            - configMapRef:
                name: hoarder-configuration
      volumes:
        - name: meilisearch
          persistentVolumeClaim:
            claimName: meilisearch-pvc