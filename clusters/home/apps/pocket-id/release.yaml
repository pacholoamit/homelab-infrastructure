apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: default
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: pocket-id
      version: "2.13.0"
      sourceRef:
        kind: HelmRepository
        name: pocket-id
        namespace: flux-system
      interval: 1m
  values:
    # Top-level appUrl: chart prepends https:// itself, expects bare hostname.
    appUrl: "pocketid.pacholoamit.com"
    config:
      smtpHost: "smtp.resend.com"
      smtpPort: "587"
      smtpFrom: "noreply@pacholoamit.com"
      # Emit email_verified=true so Vaultwarden will bind an SSO identity to an
      # existing local account. Vaultwarden 1.36.0 (CVE-2026-47164) started
      # requiring that claim on this path, which pocket-id was never asserting.
      # Safe here because allowUserSignups is disabled: accounts are created by
      # an admin only, so nobody can self-register claiming someone's address.
      # Preferred over Vaultwarden's SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION, which
      # would disable that check globally rather than fixing the claim at source.
      emailsVerified: "true"
    existingSecret: pocket-id-secrets
    persistence:
      enabled: true
      storageClass: longhorn
      size: 2Gi
      accessMode: ReadWriteOnce
    service:
      type: ClusterIP
      port: 1411
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: pocket-id
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: pocket-id
                annotations:
                  glance/name: Pocket ID
                  glance/icon: si:openid
