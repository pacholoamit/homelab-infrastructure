apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: kured
      version: "5.12.x"
      sourceRef:
        kind: HelmRepository
        name: kube-reboot
        namespace: kube-system
      interval: 1m
  values:
    configuration:
      period: 5m
      timeZone: Asia/Manila
      startTime: "02:00"
      endTime: "05:00"
      rebootDays:
        - mo
        - tu
        - we
        - th
        - fr
        - sa
        - su
      logLevel: info
      # Without a timeout a drain that cannot finish keeps the node cordoned
      # and holds kured's lock, so no node reboots: k3s-node-3 stayed out for
      # four days on a Longhorn disruption budget (2026-11-13 to 2026-11-17).
      # On a timeout kured releases the lock, uncordons the node and tries
      # again on its next 5-minute tick inside the window.
      drainTimeout: 30m
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
