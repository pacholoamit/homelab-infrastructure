apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 168h # 7 days
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  values:
    persistence:
      defaultClass: false
      defaultDataLocality: best-effort
    defaultSettings:
      backupTarget: s3://velero-k3s-cluster-backups@ap-southeast-1/longhorn-backups
      backupTargetCredentialSecret: longhorn-aws-credentials
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      detachManuallyAttachedVolumesWhenCordoned: true
      guaranteedInstanceManagerCPU: "10"
      v2DataEngine: false
      v1DataEngine: true
      orphanAutoDeletion: true
      rwxVolumeFastFailover: true
      autoCleanupSnapshotWhenDeleteBackup: true
      restoreVolumeRecurringJobs: true
      replicaAutoBalance: best-effort
      replicaReplenishmentWaitInterval: "0"
      # A drain may go on once the node's last-copy replicas are stopped,
      # which they are as soon as the drain has evicted their pods. The
      # runners' one-replica cache volumes are the only ones this concerns:
      # every other volume has replicas on other nodes. Under
      # block-for-eviction-if-contains-last-replica Longhorn first copied
      # each 15Gi cache to another node, a rebuild that left a system
      # snapshot behind every time, and it waited for good on a replica
      # that had failed (k3s-node-3, 2026-11-13 to 2026-11-17). A one-replica
      # volume attached from another node still holds the drain until its
      # pod stops; kured's drainTimeout then lets the node go.
      nodeDrainPolicy: allow-if-replica-is-stopped
      autoSalvage: true
      replicaSoftAntiAffinity: false
      # Nodes carry no topology.kubernetes.io/zone label, and Longhorn treats
      # unlabelled nodes as a single zone. Keeping this false made strict zone
      # anti-affinity cap every volume at one replica, so nothing could rebuild.
      # Node-level anti-affinity above still enforces one replica per node.
      replicaZoneSoftAntiAffinity: true
      concurrentReplicaRebuildPerNodeLimit: 5
      concurrentVolumeBackupRestorePerNodeLimit: 5
      disableSchedulingOnCordonedNode: true
      defaultDataLocality: best-effort
      systemManagedComponentsNodeSelector: ""
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-iscsi-installation
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-iscsi-installation
                annotations:
                  glance/hide: "true"
          - target:
              kind: DaemonSet
              name: longhorn-nfs-installation
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-nfs-installation
                annotations:
                  glance/hide: "true"
          - target:
              kind: DaemonSet
              name: longhorn-nvme-cli-installation
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-nvme-cli-installation
                annotations:
                  glance/hide: "true"
          - target:
              kind: DaemonSet
              name: longhorn-spdk-setup
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-spdk-setup
                annotations:
                  glance/hide: "true"
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
                annotations:
                  glance/name: Longhorn
                  glance/icon: di:longhorn