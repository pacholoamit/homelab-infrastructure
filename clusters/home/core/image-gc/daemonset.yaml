# Removes the images no container on the node uses, once a week, at an hour
# when nothing is moving: Sundays 13:00 Asia/Manila.
#
# It never prunes when it starts. Until 2026-11-17 it did, so it ran at every
# node boot, when "unused" still includes the images of pods a drain moved
# away and that are about to come back: on k3s-node-3 it deleted Longhorn's
# instance-manager image seconds after the node came back, and Longhorn pulled
# its 484 MB again before it could serve that node's replicas. kured reboots
# nodes between 02:00 and 05:00, so the prune stays well clear of it.
#
# crictl is the node's own (k3s carries it), mounted read-only. The old script
# downloaded one from GitHub at every start and failed until the network was up.
# `rmi --prune` leaves containerd's pinned images (the pause image) alone.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-gc
  namespace: image-gc
  labels:
    app: image-gc
spec:
  selector:
    matchLabels:
      app: image-gc
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: image-gc
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      terminationGracePeriodSeconds: 10
      containers:
        - name: image-gc
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              crictl=/var/lib/rancher/k3s/data/current/bin/crictl
              sock=unix:///run/k3s/containerd/containerd.sock
              # Sunday 13:00, counted in seconds from Monday 00:00.
              target=$((6 * 86400 + 13 * 3600))
              while true; do
                # %u is 1 (Monday) to 7 (Sunday); ${x#0} drops a leading zero,
                # which the shell would read as octal.
                set -- $(date '+%u %H %M %S')
                now=$((($1 - 1) * 86400 + ${2#0} * 3600 + ${3#0} * 60 + ${4#0}))
                wait=$(((target - now + 604800) % 604800))
                if [ "$wait" -eq 0 ]; then wait=604800; fi
                echo "[$(date -Iseconds)] ${NODE_NAME}: next prune in ${wait}s (Sundays 13:00)"
                sleep "$wait"
                echo "[$(date -Iseconds)] pruning unused images on ${NODE_NAME}"
                "$crictl" --runtime-endpoint "$sock" rmi --prune || echo "prune failed (next try in a week)"
                sleep 60
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Asia/Manila as a POSIX zone (UTC+8, no daylight saving): the
            # alpine image carries no zone files.
            - name: TZ
              value: "<+08>-8"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/k3s/containerd
              readOnly: false
            # Same path as on the node: k3s's `current` link is absolute.
            - name: k3s-data
              mountPath: /var/lib/rancher/k3s/data
              readOnly: true
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd
            type: Directory
        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s/data
            type: Directory
